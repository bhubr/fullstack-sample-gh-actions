name: CI

on:
  pull_request:
  push:
#    branches:
#      - main

jobs:

  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - run: pnpm i --frozen-lockfile

      - run: pnpm lint
